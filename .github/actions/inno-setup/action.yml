name: Install verified Inno Setup
description: >
  Downloads a pinned Inno Setup release, verifies its build attestation,
  installs it, and exports ISCC_PATH. Every workflow that compiles the
  installer uses this action, so the release build cannot drift away from the
  build that CI verifies.

inputs:
  version:
    description: Inno Setup version to install
    default: 6.7.3
  release-tag:
    description: Tag of the jrsoftware/issrc release that carries the asset
    default: is-6_7_3
  github-token:
    description: Token used to download and verify the release asset
    required: true

runs:
  using: composite
  steps:
    - shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INNO_VERSION: ${{ inputs.version }}
        INNO_RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        $asset = "innosetup-$env:INNO_VERSION.exe"
        $download = Join-Path $env:RUNNER_TEMP $asset
        $install = Join-Path $env:RUNNER_TEMP "inno-setup-$env:INNO_VERSION"
        gh release download $env:INNO_RELEASE_TAG --repo jrsoftware/issrc --pattern $asset --dir $env:RUNNER_TEMP
        Push-Location $env:RUNNER_TEMP
        try {
          gh release verify-asset $env:INNO_RELEASE_TAG $asset --repo jrsoftware/issrc
        } finally {
          Pop-Location
        }
        $process = Start-Process -FilePath $download -ArgumentList @(
          '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$install`""
        ) -Wait -PassThru
        if ($process.ExitCode -ne 0) {
          throw "Inno Setup installer exited with code $($process.ExitCode)"
        }
        $compiler = Join-Path $install 'ISCC.exe'
        if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
          throw "Inno Setup compiler was not installed at $compiler"
        }
        "ISCC_PATH=$compiler" >> $env:GITHUB_ENV
