name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify shared contracts
        run: node tools/verify-contracts.mjs
      - name: Exercise release-gate scorer
        run: node quality/score.mjs --manifest quality/fixtures/corpus.json --candidate quality/fixtures/candidate.json --baseline quality/fixtures/baseline.json --out /tmp/patchthrough-score.json
      - name: Test private review packet generator
        run: node --test quality/prepare-review.test.mjs
      - name: Test CLI
        working-directory: cli
        run: npm test
      - name: Build Swift app
        run: swift build
      - name: Test Swift contracts and pipeline
        run: swift test

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify shared contracts
        run: node tools/verify-contracts.mjs
      - name: Exercise release-gate scorer
        run: node quality/score.mjs --manifest quality/fixtures/corpus.json --candidate quality/fixtures/candidate.json --baseline quality/fixtures/baseline.json --out patchthrough-score.json
      - name: Test private review packet generator
        run: node --test quality/prepare-review.test.mjs
      - name: Test CLI
        working-directory: cli
        run: npm test
      - name: Restore Windows solution
        run: dotnet restore windows/Patchthrough.sln
      - name: Build Windows solution
        run: dotnet build windows/Patchthrough.sln -c Release --no-restore -warnaserror
      - name: Test Windows pipeline
        run: dotnet test windows/Patchthrough.sln -c Release --no-build
      - name: Verify session contract
        shell: pwsh
        run: windows/verify-contract.ps1
      - name: Install verified Inno Setup compiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = 'innosetup-6.7.3.exe'
          $download = Join-Path $env:RUNNER_TEMP $asset
          $install = Join-Path $env:RUNNER_TEMP 'inno-setup-6.7.3'
          gh release download is-6_7_3 --repo jrsoftware/issrc --pattern $asset --dir $env:RUNNER_TEMP
          Push-Location $env:RUNNER_TEMP
          try {
            gh release verify-asset $asset --repo jrsoftware/issrc
          } finally {
            Pop-Location
          }
          $process = Start-Process -FilePath $download -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$install`""
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installer exited with code $($process.ExitCode)"
          }
          $compiler = Join-Path $install 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Inno Setup compiler was not installed at $compiler"
          }
          "ISCC_PATH=$compiler" >> $env:GITHUB_ENV
      - name: Build Windows ZIP and installer
        shell: pwsh
        run: windows/packaging/build-release.ps1 -Version 0.0.0-ci -InnoCompiler $env:ISCC_PATH
      - name: Exercise Windows ZIP, installer, and uninstaller
        shell: pwsh
        run: windows/packaging/verify-release.ps1 -ExpectedVersion 0.0.0-ci
      - name: Upload unsigned Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: Patchthrough-windows-x64-preview
          path: |
            dist/Patchthrough-windows-x64.zip
            dist/Patchthrough-windows-x64.zip.sha256
            dist/Patchthrough-windows-x64-setup.exe
            dist/Patchthrough-windows-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
