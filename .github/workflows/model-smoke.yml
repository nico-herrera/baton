name: Real-model smoke tests

on:
  schedule:
    - cron: "31 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/verify-contracts.mjs

  macos-model:
    if: ${{ vars.RUN_MODEL_SMOKE == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Application Support/FluidAudio/Models
            ~/Documents/huggingface
          key: macos-asr-${{ hashFiles('models/registry.json', 'packaging/MODELS.lock') }}
      - name: Generate local speech fixture
        run: say -o /tmp/patchthrough-smoke.aiff "Patchthrough verifies local transcription models."
      - name: Smoke Parakeet
        run: swift run patchthrough benchmark --audio /tmp/patchthrough-smoke.aiff --engine parakeet --output /tmp/parakeet.json
      - name: Smoke experimental WhisperKit adapter
        run: swift run patchthrough benchmark --audio /tmp/patchthrough-smoke.aiff --engine whisperkit --quality max_accuracy --output /tmp/whisperkit.json

  windows-model:
    if: ${{ vars.RUN_MODEL_SMOKE == 'true' }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/patchthrough/models
          key: windows-asr-${{ hashFiles('models/registry.json') }}
      - name: Generate local speech fixture
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $voice.SetOutputToWaveFile("$env:RUNNER_TEMP\patchthrough-smoke.wav")
          $voice.Speak("Patchthrough verifies local transcription models.")
          $voice.Dispose()
      - name: Smoke Parakeet
        run: dotnet run --project windows/src/Patchthrough.Windows -c Release -- benchmark --audio "${{ runner.temp }}\patchthrough-smoke.wav" --engine parakeet --output "${{ runner.temp }}\parakeet.json"
      - name: Smoke experimental Whisper adapter
        run: dotnet run --project windows/src/Patchthrough.Windows -c Release -- benchmark --audio "${{ runner.temp }}\patchthrough-smoke.wav" --engine whisper --quality max_accuracy --output "${{ runner.temp }}\whisper.json"
