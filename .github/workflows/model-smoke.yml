name: Real-model smoke tests

on:
  schedule:
    - cron: "31 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/verify-contracts.mjs

  macos-model:
    if: ${{ vars.RUN_MODEL_SMOKE == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/FluidAudio/Models
          key: macos-parakeet-v2-${{ hashFiles('models/registry.json', 'packaging/MODELS.lock') }}
      - run: swift run patchthrough doctor

  windows-model:
    if: ${{ vars.RUN_MODEL_SMOKE == 'true' }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.patchthrough-model-cache
          key: windows-asr-${{ hashFiles('models/registry.json') }}
      - run: dotnet run --project windows/src/Patchthrough.Windows -c Release -- doctor
